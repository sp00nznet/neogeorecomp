name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Linux builds the SDL2 window; Windows builds headless-only, which is
      # what the conformance harness needs and keeps the job fast.
      - name: Install SDL2
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      # Recompiles Musashi's 68000 test programs and runs them natively;
      # fails if fewer pass than tests/conformance/BASELINE.
      - name: Conformance
        run: ctest --test-dir build -C Release --output-on-failure
